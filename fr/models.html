  <body>
    <header>
      <!-- valenoa_logo -->
      <a class="valenoa_logo" href="/index.html">
        <img
          src="/images/valenoa_logo.png"
          alt="Logo officiel de VALÉNOΛ Model Agency basée à Tokyo et Paris"
        />
      </a>
      <!-- SEO -->
      <h1 class="seo-h1">Modèles internationaux | VALÉNOΛ Model Agency</h1>

      <h2 class="seo-h2">
        Agence internationale de mannequins de mode basée entre Tokyo et Paris
      </h2>

      <!-- Language Switch -->
      <div class="language-buttons">
        <span>/　</span>

        <a
          id="japaneseBtn"
          class="lang-Btn"
          data-lang="lang-ja"
          href="/ja/models.html"
          role="button"
          aria-label="Changer la langue en japonais"
        >
          Ja
        </a>

        <span>　/　</span>

        <a
          id="englishBtn"
          class="lang-Btn"
          data-lang="lang-en"
          href="/en/models.html"
          role="button"
          aria-label="Changer la langue en anglais"
        >
          En
        </a>

        <span>　/　</span>

        <a
          id="frenchBtn"
          class="lang-Btn"
          data-lang="lang-fr"
          href="/fr/models.html"
          role="button"
          aria-label="Changer la langue en français"
        >
          Fr
        </a>

        <span>　/</span>
      </div>

      <!-- FIXED MENU -->
      <nav class="global-menu show">
        <a href="/fr/agency.html#concept">CONCEPT</a>

        <a href="/fr/models.html">MODÈLES</a>

        <a href="/fr/agency.html#contact">CONTACT</a>
      </nav>
    </header>

    <main>
      <!-- ---------FIX------------------------------------------ -->
      <!-- =========================================================

FIXED BACKGROUND UI

========================================================= -->

      <div class="fixed-ui">
        <!-- dark overlay -->
        <!-- <div class="mask-overlay"></div> -->

        <div class="argency-mask-overlay"></div>

        <!-- background movie -->
        <video
          class="background-index black-mask"
          autoplay
          muted
          loop
          playsinline
          preload="none"
        >
          <source src="/movie/background-index.webm" type="video/webm" />

          <source src="/movie/background-index.mp4" type="video/mp4" />
        </video>

        <!-- CENTER LOGO -->
        <div class="stage">
          <div class="card">
            <div class="logo-wrap">
              <svg id="logoSVG" viewBox="0 0 1200 1240">
                <defs>
                  <linearGradient id="goldStroke" x1="0" x2="1">
                    <stop offset="0%" stop-color="#fff9e6" />
                    <stop offset="35%" stop-color="#f7e7c6" />
                    <stop offset="65%" stop-color="#d4b56a" />
                    <stop offset="100%" stop-color="#fce9c0" />
                  </linearGradient>

                  <linearGradient id="champagne" x1="0" x2="1">
                    <stop offset="0%" stop-color="#fdf7ed" />
                    <stop offset="48%" stop-color="#f3e4c8" />
                    <stop offset="100%" stop-color="#e8d9b2" />
                  </linearGradient>
                </defs>

                <!-- fill -->
                <text
                  id="fillText"
                  class="fill-layer filled"
                  x="50%"
                  y="56%"
                  text-anchor="middle"
                  font-size="112"
                  font-weight="500"
                  fill="url(#champagne)"
                  font-family='"Didot","Baskerville","Times New Roman",serif'
                >
                  <tspan>V</tspan>
                  <tspan>A</tspan>
                  <tspan>L</tspan>
                  <tspan>É</tspan>
                  <tspan>N</tspan>
                  <tspan>O</tspan>
                  <tspan>Λ</tspan>
                </text>
              </svg>
            </div>

            <div class="tag">VALÉNOΛ MODEL AGENCY</div>
          </div>
        </div>
      </div>

      <!-- =======================================

MODELS GRID

======================================= -->

      <h2 class="agency-sub0">MODÈLES</h2>

      <!-- VIEWPORT -->
      <div class="viewport" id="viewport">
        <div class="canvas-wrapper" id="canvasWrapper">
          <section class="models-gallery">
            <div id="models-container"></div>
          </section>
        </div>
      </div>

      <!-- ZOOM CONTROLS -->
      <div class="controls-container" id="controlsContainer">
        <div class="percentage-indicator" id="percentageIndicator">60%</div>

        <div class="switch">
          <button class="switch-button active" id="normalBtn">NORMAL</button>

          <button class="switch-button" id="zoomOutBtn">ZOOM OUT</button>

          <button class="switch-button" id="zoomInBtn">ZOOM IN</button>
        </div>
      </div>

      <!-- ====================================================CONTACT -->

      <!-- FR -->
      <div id="common-contact" data-lang="fr"></div>

      <!-- ========================================================= -->
    </main>

SCROLL CONTENT

========================================================= -->
