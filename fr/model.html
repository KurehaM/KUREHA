    <script>
      window.addEventListener("load", () => {
        // Fade-in global
        document.body.classList.add("page-loaded");

        // Vidéo de fond
        setTimeout(() => {
          document.querySelector(".video-background").classList.add("show");
        }, 400);

        // Texte KUREHA
        setTimeout(() => {
          document.getElementById("kureha-title").classList.add("show");
        }, 1800);

        // MENU
        setTimeout(() => {
          document.querySelector(".global-menu").classList.add("show");
        }, 2600);
      });
    </script>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const kurehaTitle = document.getElementById("kureha-title");

        if (kurehaTitle) {
          kurehaTitle.addEventListener("click", (e) => {
            e.preventDefault();

            const href = kurehaTitle.href;

            kurehaTitle.classList.add("clicked");

            document.body.classList.add("page-transition");

            setTimeout(() => {
              window.location.href = href;
            }, 2200);
          });
        }
      });
    </script>
